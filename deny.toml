[graph]
# Silk only builds for Windows (DirectML).
targets = ["x86_64-pc-windows-msvc"]

[licenses]
# Permissive licenses only. GPL and LGPL appear in the tree only as
# alternatives (e.g. self_cell is "Apache-2.0 OR GPL-2.0-only"), which the
# permissive option satisfies. OFL-1.1 and Ubuntu-font-1.0 cover the fonts
# bundled with egui.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
