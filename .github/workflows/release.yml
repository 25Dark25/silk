name: Release build

# Run by hand on a release tag. Builds the portable zip, the MSI installer and
# their SHA256SUMS, prints the hashes in the log and uploads them as an
# artifact. Signing and publishing are done by the maintainer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.99.1"
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: Build
        run: cargo build --locked --release
      - name: Package
        run: ./tools/release/package.ps1 -Tag $env:TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silk-${{ inputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS
          if-no-files-found: error
